name: Deploy to AWS EC2

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/marlondb-003/ecommerc-tec:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_API_BASE_URL=

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u marlondb-003 --password-stdin
            docker network create techworld-net || true
            docker pull $IMAGE
            docker stop techworld-web || true
            docker rm techworld-web || true
            docker run -d \
              --name techworld-web \
              --network techworld-net \
              --restart always \
              -p 80:80 \
              $IMAGE
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
