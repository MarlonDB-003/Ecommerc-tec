server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version from responses
    server_tokens off;

    client_max_body_size 5m;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                              always;
    add_header X-Frame-Options          "DENY"                                 always;
    add_header X-XSS-Protection         "1; mode=block"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:;" always;
    # Uncomment when TLS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript;

    # Proxy all /api/* requests to the backend container
    location /api/ {
        proxy_pass         http://techworld-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
